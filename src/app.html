<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="%sveltekit.assets%/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <script>
      try {
        const raw = localStorage.getItem('immich-ui-theme');
        if (raw !== null) {
          let preference;
          const parsed = JSON.parse(raw);

          if (parsed && typeof parsed === 'object') {
            if (parsed.system) {
              preference = 'system';
            } else if (parsed.value) {
              preference = parsed.value;
            }
          } else if (typeof parsed === 'string' && ['light', 'dark', 'system'].includes(parsed)) {
            preference = parsed;
          }

          const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
          const isDark = preference === 'dark' || (preference !== 'light' && prefersDark);

          document.documentElement.classList.toggle('dark', isDark);
          document.documentElement.classList.toggle('light', !isDark);
        }
      } catch {
        // noop
      }
    </script>

    %sveltekit.head%
  </head>
  <body data-sveltekit-preload-data="hover" class="bg-bg text-dark">
    <div>%sveltekit.body%</div>
  </body>
</html>
